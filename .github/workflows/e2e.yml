name: E2E

# Separate from ci.yml on purpose (cycle 003 §1). The five gates plus
# format:check stay exactly as they are and never see a browser image; this
# workflow owns everything that needs one.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly, arbitrary UTC hour with no other significance. Feeds the
    # `perf` job only — see that job's `if:` below.
    - cron: "17 3 * * *"
  workflow_dispatch:

# Never cancel a scheduled (nightly) run — that run is the trend line's
# record for that night. Mirrors ci.yml's own reasoning for the same rule.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
  # Every screenshot assertion in this cycle checks this before comparing
  # anything (cycle 003 §2.3) — CoreText and FreeType hint and antialias
  # differently, and every baseline this repo commits is Linux-rendered
  # inside the exact image pinned below. Set once, for every job, rather than
  # per-step.
  HC_SNAPSHOT_ENV: docker

jobs:
  # Cycle 005. No longer pull-request-only — this is the only place any
  # event decides whether `visual` runs, so it has to run on all four events
  # itself or a skipped `changes` silently skips `visual` too. A job whose
  # `needs:` dependency was skipped is skipped itself: an `if:` with no
  # status-check function carries an implicit `success()`, and `success()`
  # is false against a skipped dependency. That is why the 68 committed
  # baselines gated pull requests and never `main` (E2E run 31049219574,
  # merge commit c9e0bbb: `e2e` succeeded, `changes`, `perf` and `visual` all
  # skipped) — `visual`'s own three-way `if:` never mattered, because
  # `changes` being pull-request-only skipped it first on every other event.
  # `timeout-minutes: 10` — this job touches no browser and needs no image
  # pull, so 10 is headroom over its normal sub-minute run rather than a
  # measured ceiling; an unavailable runner label queues instead of erroring,
  # and the GitHub default of 360 minutes turns that into a six-hour hang.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      visual: ${{ steps.filter.outputs.hit }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history — the diff below needs `origin/main` to resolve to
          # something real, not the shallow single commit `checkout` fetches
          # by default.
          fetch-depth: 0

      - name: Should the visual job run?
        id: filter
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # `shell: bash` rather than the default, for `-o pipefail`. The
          # default `run` shell on Linux is `bash -e` without it.
          #
          # This job is now the only place that decides whether `visual`
          # runs, for every event. A job whose `needs:` dependency was
          # skipped is skipped itself — an `if:` with no status-check
          # function carries an implicit `success()`, and `success()` is
          # false against a skipped dependency. So gating `visual` on event
          # names in its own `if:` never worked and could not: `changes` was
          # pull-request-only, and skipping it skipped `visual` whatever
          # `visual` asked for. That is why the 68 committed baselines
          # gated pull requests and never `main` (E2E run 31049219574,
          # merge commit c9e0bbb: `e2e` succeeded, `changes`, `perf` and
          # `visual` all skipped), and why `workflow_dispatch` on `visual`
          # was dead for the same reason and had never been noticed.
          #
          # `EVENT` comes through the environment rather than being
          # interpolated into the script body. `github.event_name` is a
          # controlled enum and cannot carry an injection today, but the
          # habit is what keeps that true when the next condition reads
          # something a contributor controls.
          case "$EVENT" in
            push | workflow_dispatch)
              # `main` gets the full comparison unconditionally. The
              # blast-radius filter is a pull-request cost optimisation;
              # a `main` run is the permanent record for that commit, which
              # is ci.yml's own stated reason for never cancelling one.
              echo "hit=true" >> "$GITHUB_OUTPUT"
              ;;
            pull_request)
              # Written to a file and checked in three steps rather than
              # piped straight into `if`. A pipeline reports its last
              # command's status, so `git diff | grep -q` reads exactly the
              # same as "the diff succeeded and matched nothing" when the
              # diff itself failed — `origin/main` failing to resolve would
              # silently disable the visual gate. `test -s` closes it: a
              # pull request with zero changed files does not exist.
              #
              # QA-CONTRACT.md Rule R1's blast radius, verbatim — the exact
              # set that already means "every consumer is re-verified"
              # (cycle 003 §5). Fix F9 (cycle 004 iteration 2): `layout.tsx`
              # loads Kalam via `next/font/google`, and every specimen's
              # geometry is measured against those metrics; `globals.css`
              # declares `--hc-font-hand` and the `body` background F1
              # fixed; `fixtures.ts` holds `matrixUrl`'s key emission and
              # `gotoSpecimen`'s settle, neither matched by the existing
              # `tests/e2e/matrix` prefix. Fix F12 (cycle 004 iteration 3):
              # `playwright.config.ts` holds `snapshotPathTemplate` (where
              # every one of the 67 baselines is read from and written to)
              # and the `visual` project's `testMatch`, `retries` and
              # `devices["Desktop Chrome"]` — the 1280x720 viewport and
              # deviceScaleFactor every pixel derivation in the cycle
              # document depends on. Cycle 004a: this workflow file now
              # selects which manifest of a two-entry OCI image index runs
              # the comparison, so editing it changes all 67 captures the
              # way changing the image tag would; `snapshot-env.ts` holds the
              # constants both architecture guards assert against. Cycle 005:
              # `packages/core/src/theme/context\.tsx` widens to
              # `packages/core/src/theme/`, which now also holds
              # `surface.tsx` — it paints every matrix cell's background, and
              # an edit there that did not trigger `visual` would be the
              # exact miss this cycle exists to close. `harness\.tsx` and
              # `page\.tsx` both change in this cycle and are both rendered
              # by D-NJS's committed baseline in the `e2e` job, which runs on
              # every pull request unconditionally — belt-and-braces here,
              # not a live gap.
              git diff --name-only origin/main...HEAD > "$RUNNER_TEMP/changed.txt"
              test -s "$RUNNER_TEMP/changed.txt"
              if grep -qE '^(packages/core/src/engine/|packages/core/src/theme/|packages/core/src/frame/|packages/core/src/styles/handicraft\.css|registry/default/|apps/playground/app/matrix/|apps/playground/app/hc-params\.ts|apps/playground/app/layout\.tsx|apps/playground/app/globals\.css|apps/playground/app/harness\.tsx|apps/playground/app/page\.tsx|tests/e2e/matrix|tests/e2e/fixtures\.ts|playwright\.config\.ts|^\.github/workflows/e2e\.yml|^tests/e2e/snapshot-env\.ts)' \
                "$RUNNER_TEMP/changed.txt"; then
                echo "hit=true" >> "$GITHUB_OUTPUT"
              else
                echo "hit=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              # `schedule`. The nightly run feeds `perf` only.
              echo "hit=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  # Tier parity, degraded modes, axe, overflow. Gates every pull request —
  # this is the job the "under 3 minutes" claim (withdrawn, cycle 003 §4) was
  # about, and the one whose real wall time replaces it.
  # Cycle 004a. `runs-on: ubuntu-24.04-arm`, not `ubuntu-latest` — D-NJS is a
  # committed screenshot baseline in this job, and the pinned image tag below
  # is an OCI image *index* with two entries, sha256:c091b21d… for
  # linux/amd64 and sha256:941cc91e… for linux/arm64 (re-checkable with
  # `docker manifest inspect mcr.microsoft.com/playwright:v1.62.1-noble`). The
  # daemon picks a manifest by host architecture, so the same tag string
  # resolves to two different Chromium binaries — on `ubuntu-latest` this job
  # ran amd64 against an arm64-generated baseline. `timeout-minutes: 20`:
  # neither job carried one before this cycle, and an unavailable or
  # mistyped runner label does not error, it queues — the GitHub default is
  # 360 minutes, which turns a label problem into a six-hour hang instead of
  # a same-day failure. The failing run measured 97s wall for this job; 20
  # minutes is 12.4x that, enough headroom for a cold arm64 runner with no
  # pnpm cache.
  e2e:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v7

      # No setup-node step: the pinned image already ships the Node version
      # its own Playwright build was tested against (confirmed live at
      # v24.18.1, Ubuntu 24.04 Noble — satisfies package.json's `"node":
      # ">=20"`), so adding one would just install a second, uncoordinated
      # Node alongside it.
      - run: corepack enable

      - name: Resolve the pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-e2e-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-e2e-pnpm-store-

      # `pnpm-workspace.yaml`'s `allowBuilds` blocks playwright's own
      # postinstall (the browser downloader) the same way it does locally
      # (cycle 003 §2.4) — harmless here because the pinned image already
      # carries Chromium at the exact version `@playwright/test` expects, at
      # the path it expects it. No `playwright install` step exists on
      # purpose.
      - run: pnpm install --frozen-lockfile

      - run: pnpm test:e2e

  # Cycle 004's job. Its trigger logic was built and verified in cycle 003 —
  # the `changes` job above and the `if:` below are real and were tested on a
  # real pull request in both directions there, against a placeholder
  # payload. Cycle 004 replaces that placeholder with the real suite: the
  # standalone `pnpm build` step stays (a build failure now surfaces as its
  # own step rather than as a `webServer` timeout inside the test run).
  # Cycle 004a. `runs-on: ubuntu-24.04-arm`, `timeout-minutes: 20` — same
  # mechanism and the same derivation as the `e2e` job's comment above; this
  # job holds all 67 matrix baselines, the majority of what moved. On
  # `ubuntu-latest` this job ran the amd64 half of the pinned tag's image
  # index against arm64-generated baselines: 11 of 67 cells disagreed, 146 to
  # 874 differing pixels, including two tier-1 cells that run no JavaScript
  # at all (cycle 004a §1). Moving both baseline-touching jobs to
  # `ubuntu-24.04-arm` resolves the tag to sha256:941cc91e… on both CI and
  # the founder's colima daemon — the same digest, not merely the same tag
  # string. `changes` and `perf` stay on `ubuntu-latest` on purpose: `changes`
  # touches no browser and no baseline, and `perf` measures wall time under
  # `QA-CONTRACT.md`'s "identical conditions" rule — moving it would break its
  # own trend line to fix an architecture problem it does not have. The
  # statable rule: every job that reads or writes a committed screenshot
  # baseline runs on `linux/arm64`; jobs that do neither stay on
  # `ubuntu-latest`.
  visual:
    needs: changes
    # Cycle 005. One condition, no event names, no status functions — every
    # event now goes through `changes`, which runs on all four and emits
    # `hit=true` unconditionally for `push` and `workflow_dispatch`, runs
    # the blast-radius diff for `pull_request`, and `hit=false` for
    # `schedule`. The previous three-way `if:` (`workflow_dispatch` OR
    # `pull_request`-with-a-hit, falling through to false for everything
    # else) never ran on two of the three events it named: `changes` being
    # pull-request-only meant a `push` or `workflow_dispatch` run never
    # produced `needs.changes.outputs.visual` at all, so any branch reading
    # that output on those events read an unset output — an empty string,
    # false against `== 'true'` — regardless of what this `if:` said.
    if: needs.changes.outputs.visual == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - name: Resolve the pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-e2e-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-e2e-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:e2e:visual

  # Record-only. Never gates a pull request — QA-CONTRACT.md's budgets are
  # stated under conditions a shared 2-vCPU runner is not, and asserting them
  # here would manufacture failures that are correct to ignore (cycle 003
  # §5). `pnpm test:e2e:perf` on the founder's own machine remains the
  # authoritative, asserting run.
  #
  # Cycle 004a. Deliberately still `ubuntu-latest`, not moved alongside `e2e`
  # and `visual`. This job writes no committed baseline and reads none, so it
  # has no architecture dependency to fix — it measures time, and
  # `QA-CONTRACT.md` binds the +15% cycle-over-cycle flag to figures "taken
  # under identical conditions — same command, same throttle, same
  # instrument." An architecture change is a change of conditions; moving
  # this job would silently break its own trend line to fix a problem it does
  # not have.
  perf:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      HC_PERF_RECORD_ONLY: "1"
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - name: Resolve the pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-e2e-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-e2e-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e:perf
